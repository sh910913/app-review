[project]
name = "app-review"
version = "0.1.0"
description = "Fetch public App Store reviews across country storefronts"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
app-review = "app_review.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app_review*"]
