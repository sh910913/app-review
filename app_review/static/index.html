<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>各國 App 評論</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a1a;
      --muted: #8a8a8a;
      --line: #e6e6e6;
      --paper: #ffffff;
      --card: #ffffff;
      --accent: #1a1a1a;
      --accent-ink: #ffffff;
      --star: #1a1a1a;
      --warn: #8d3a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "PingFang TC", "Noto Sans CJK TC", sans-serif;
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: 0.02em;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px 28px;
    }

    .masthead h1 { flex: 1 1 auto; }

    .language { flex: 0 0 auto; margin-bottom: 4px; }

    .language select {
      width: auto;
      min-width: 11rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    main {
      width: min(680px, calc(100% - 48px));
      margin: 0 auto;
      padding: 56px 0 96px;
    }

    .eyebrow {
      margin: 0 0 16px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 500;
      letter-spacing: 0.06em;
      line-height: 1.35;
    }

    .lede {
      max-width: 36em;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    form {
      margin-top: 40px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .fields {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    input[type="text"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--card);
      color: var(--ink);
      font: 15px/1.5 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "PingFang TC", "Noto Sans CJK TC", sans-serif;
      padding: 11px 12px;
    }

    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 1px solid var(--ink);
      outline-offset: 3px;
    }

    button {
      border: 1px solid var(--ink);
      border-radius: 0;
      background: var(--ink);
      color: var(--accent-ink);
      font: 14px/1.2 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "PingFang TC", "Noto Sans CJK TC", sans-serif;
      letter-spacing: 0.12em;
      padding: 12px 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .text-button {
      margin-top: 14px;
      padding: 0 0 1px;
      border: 0;
      border-bottom: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    #status, #error {
      min-height: 1.4em;
      margin: 20px 0 0;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    #status { color: var(--muted); }
    #error { color: var(--warn); }

    .summary {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--ink);
    }

    .summary h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .meta {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .meta a { color: inherit; }

    .note {
      margin: 20px 0 0;
      padding: 0 0 0 12px;
      border-left: 1px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }

    .profile {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: start;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 0;
      border: 1px solid var(--line);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      padding: 1px 8px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .facts {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    .stat {
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .stat h3 {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .stat p {
      margin: 8px 0 0;
      font-size: 15px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 7.5em 1fr 3em;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      font-size: 14px;
    }

    .bar {
      height: 2px;
      border-radius: 0;
      background: var(--line);
      overflow: hidden;
    }

    .bar span {
      display: block;
      height: 100%;
      background: var(--ink);
    }

    .description {
      margin: 14px 0 0;
      white-space: pre-wrap;
    }

    .description.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .shot-label {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .shots {
      display: flex;
      gap: 10px;
      max-width: 100%;
      margin-top: 8px;
      overflow-x: auto;
    }

    .shots img {
      height: 280px;
      width: auto;
      border-radius: 0;
      border: 1px solid var(--line);
      background: white;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 140px 1fr;
      gap: 12px;
      margin-top: 28px;
    }

    .original {
      color: var(--muted);
      font-size: 14px;
    }

    .original-label {
      display: block;
      margin-bottom: 2px;
      font-size: 11px;
      letter-spacing: 0.14em;
    }

    .review {
      margin: 0;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }

    .review header {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: baseline;
      justify-content: space-between;
    }

    .stars {
      color: var(--star);
      letter-spacing: 0.12em;
      font-size: 12px;
    }

    .who {
      color: var(--muted);
      font-size: 14px;
    }

    .review h3 {
      margin: 10px 0 0;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    .review p {
      margin: 8px 0 0;
      white-space: pre-wrap;
      font-size: 16px;
    }

    #more {
      margin-top: 28px;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--ink);
    }

    .empty {
      margin-top: 18px;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      main { width: min(680px, calc(100% - 32px)); padding-top: 32px; }
      .masthead { flex-direction: column; align-items: stretch; }
      .language, .language select { width: 100%; }
      .fields, .filters, .stat-grid { display: grid; grid-template-columns: 1fr; }
      button { width: 100%; }
      .text-button { width: auto; }
    }
  </style>
</head>

        <button id="submit" type="submit"></button>

      <button id="example" class="text-button" type="button"></button>
    </form>
    <p id="status" role="status"></p>
    <p id="error" role="alert" hidden></p>
    <section id="results" hidden></section>
  </main>

        fullDescription: "الوصف الكامل", lessDescription: "عرض أقل", screenshots: "لقطات",
        failures: "حجب Apple ‏{count} متجرًا. تظهر مراجعات المتاجر التي استجابت.",
        partial: "قطع Apple الصفحات التالية لـ {count} متجرًا. المراجعات التي وصلت تبقى.",
        starsAria: "{n} من 5 نجوم"
      }
    }

    const form = document.querySelector("#lookup")
    const appInput = document.querySelector("#app")
    const submitButton = document.querySelector("#submit")
    const statusNode = document.querySelector("#status")
    const errorNode = document.querySelector("#error")
    const resultsNode = document.querySelector("#results")

    let current = null
    let shown = PAGE_SIZE
    let country = "all"
    let rating = "all"
    let query = ""
    let uiLang = languageFromBrowser()
    let targetLang = uiLang
    let renderToken = 0
    const translationCache = new Map()

    const languageSelect = document.querySelector("#language")
    languageSelect.addEventListener("change", () => {
      const next = languageSelect.value
      if (next) {
        uiLang = next
        targetLang = next
      } else {
        targetLang = ""
      }
      applyChrome()
      setError("")
      if (current) {
        resultsNode.replaceChildren(summaryBlock(), listBlock())
        renderList()
      }
    })
    applyChrome()

    document.querySelector("#example").addEventListener("click", () => {
      appInput.value = EXAMPLE
      form.requestSubmit()
    })

    form.addEventListener("submit", (event) => {
      event.preventDefault()
      lookup(appInput.value.trim())
    })

    function languageFromBrowser() {
      const tags = navigator.languages?.length ? navigator.languages : [navigator.language || "en"]
      for (const tag of tags) {
        const match = matchLanguage(tag)
        if (match) return match
      }
      return "en"
    }

    function matchLanguage(tag) {
      const lower = String(tag || "").toLowerCase().replaceAll("_", "-")
      if (lower.startsWith("zh")) {
        if (lower.includes("hant") || /-(tw|hk|mo)$/.test(lower)) return "zh-TW"
        return "zh-CN"
      }
      return PRIMARY_LANGUAGE[lower.split("-")[0]] || ""
    }

    function t(key, vars) {
      const pack = COPY[uiLang] || COPY.en
      let text = pack[key] || COPY.en[key] || key
      if (vars) {
        for (const [name, value] of Object.entries(vars)) {
          text = text.replaceAll(`{${name}}`, String(value))
        }
      }
      return text
    }

    function dateLocale() {
      if (uiLang === "zh-TW") return "zh-Hant"
      if (uiLang === "zh-CN") return "zh-Hans"
      return uiLang || "en"
    }

    function languageName(code) {
      const found = LANGUAGES.find((item) => item[0] === code)
      return found ? found[1] : code
    }

    function applyChrome() {
      document.documentElement.lang = dateLocale()
      document.documentElement.dir = uiLang === "ar" ? "rtl" : "ltr"
      document.title = t("title")
      document.querySelector("#eyebrow").textContent = "App Store"
      document.querySelector("#heading").textContent = t("title")
      document.querySelector("#lede").textContent = t("lede")
      document.querySelector("#app-label").textContent = t("appLabel")
      document.querySelector("#language-label").textContent = t("languageAria")
      languageSelect.setAttribute("aria-label", t("languageAria"))
      appInput.placeholder = t("placeholder")
      document.querySelector("#example").textContent = t("example")
      const selected = languageSelect.value
      languageSelect.replaceChildren()
      for (const [code, label] of LANGUAGES) {
        languageSelect.append(option(code, code ? label : t("originalOption")))
      }
      languageSelect.value = targetLang ? uiLang : ""
      if (languageSelect.value === "" && selected && !targetLang) languageSelect.value = ""
      setBusy(submitButton.disabled)
    }

    function countryName(code) {
      try {
        const name = new Intl.DisplayNames([dateLocale()], { type: "region" }).of(String(code || "").toUpperCase())
        if (name) return name
      } catch (error) {
        /* fall through */
      }
      return String(code || "").toUpperCase()
    }

    function formatStatus(event) {
      if (event.kind === "scan") return t("statusScan", { count: event.count })
      if (event.kind === "ratings") {
        const list = Array.isArray(event.storefronts) ? event.storefronts : []
        if (list.length === 1) return t("statusFoundOne", { country: countryName(list[0].country) })
        if (list.length > 1) return t("statusFoundMany", { count: list.length })
        return t("prepare")
      }
      if (event.kind === "empty") return t("statusEmpty", { name: event.name || "" })
      if (event.kind === "failure") return event.message || ""
      return event.message || ""
    }

    function errorText(code) {
      return t(code || "errorQuery")
    }

    function setBusy(busy) {
      submitButton.disabled = busy
      appInput.disabled = busy
      submitButton.textContent = busy ? t("searching") : t("submit")
    }

    function setStatus(message) {
      statusNode.textContent = message || ""
    }

    function setError(message) {
      errorNode.hidden = !message
      errorNode.textContent = message || ""
    }

    async function lookup(app) {
      setBusy(true)
      setError("")
      setStatus(t("prepare"))
      resultsNode.hidden = true
      resultsNode.replaceChildren()
      current = null
      try {
        const response = await fetch("/api/reviews", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ app })
        })
        if (!response.ok) {
          const body = await response.json().catch(() => ({}))
          throw new Error(errorText(body.code))
        }
        await readEvents(response)
      } catch (error) {
        setStatus("")
        setError(error instanceof Error ? error.message : t("errorQuery"))
      } finally {
        setBusy(false)
      }
    }

    async function readEvents(response) {
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ""
      let sawResult = false
      while (true) {
        const { done, value } = await reader.read()
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done })
        const lines = buffer.split("\n")
        buffer = lines.pop() || ""
        for (const line of lines) {
          if (!line.trim()) continue
          const event = JSON.parse(line)
          if (event.type === "status") setStatus(formatStatus(event))
          if (event.type === "error") throw new Error(errorText(event.code))
          if (event.type === "result") {
            sawResult = true
            showResult(event.data)
          }
        }
        if (done) break
      }
      if (!sawResult) throw new Error(t("errorNoData"))
    }

    function showResult(data) {
      current = data
      shown = PAGE_SIZE
      country = "all"
      rating = "all"
      query = ""
      setStatus("")
      setError("")
      resultsNode.hidden = false
      resultsNode.replaceChildren(summaryBlock(), listBlock())
      renderList()
    }

    function formatNumber(value) {
      return new Intl.NumberFormat(dateLocale()).format(value)
    }

    function ago(iso) {
      const then = new Date(iso)
      if (Number.isNaN(then.getTime())) return ""
      const rtf = new Intl.RelativeTimeFormat(dateLocale(), { numeric: "auto" })
      const days = Math.round((then.getTime() - Date.now()) / 86400000)
      if (Math.abs(days) < 45) return rtf.format(days, "day")
      const months = Math.round(days / 30.4375)
      if (Math.abs(months) < 18) return rtf.format(months, "month")
      return rtf.format(Math.round(days / 365.25), "year")
    }

    function note(text) {
      const node = document.createElement("p")
      node.className = "note"
      node.textContent = text
      return node
    }

    function summaryBlock() {
      const storefronts = current.storefronts || []
      const summary = document.createElement("div")
      summary.className = "summary"
      const app = current.app
      if (app) summary.append(profileBlock(app, storefronts))
      else {
        const title = document.createElement("h2")
        title.textContent = current.name || current.app_id
        summary.append(title)
      }

      const meta = document.createElement("p")
      meta.className = "meta"
      const link = document.createElement("a")
      const store = (app && app.country) || (storefronts[0] && storefronts[0].country) || "us"
      link.href = (app && app.url) || `https://apps.apple.com/${store}/app/id${current.app_id}`
      link.target = "_blank"
      link.rel = "noreferrer"
      link.textContent = `App ID ${current.app_id}`
      const metaText = t("meta", {
        id: "\u0000",
        reviews: current.reviews.length,
        countries: storefronts.length
      })
      meta.append(link, document.createTextNode(metaText.split("\u0000")[1] || ""))
      summary.append(meta)
      if (storefronts.length) summary.append(statGrid(storefronts))
      if (app && app.description) summary.append(descriptionBlock(app.description))
      if (app && app.screenshots && app.screenshots.length) summary.append(shotBlock(app.screenshots))

      const truncated = storefronts.filter((item) => item.truncated)
      if (truncated.length) {
        summary.append(note(t("truncated", { countries: truncated.map((item) => countryName(item.country)).join(", ") })))
      }
      const partialCount = storefronts.filter((item) => item.partial).length
      if (partialCount) summary.append(note(t("partial", { count: partialCount })))
      if ((current.failures || []).length) {
        summary.append(note(t("failures", { count: current.failures.length })))
      }
      if ((current.reviews || []).length) summary.append(filterBar(storefronts))
      return summary
    }

    function profileBlock(app) {
      const profile = document.createElement("div")
      profile.className = "profile"
      if (!app.artwork) profile.style.gridTemplateColumns = "1fr"
      if (app.artwork) {
        const icon = document.createElement("img")
        icon.className = "icon"
        icon.src = app.artwork
        icon.alt = ""
        profile.append(icon)
      }
      const body = document.createElement("div")
      const title = document.createElement("h2")
      title.textContent = current.name || current.app_id
      body.append(title)
      const rating = document.createElement("p")
      rating.className = "meta"
      const bits = []
      if (typeof app.average_rating === "number") bits.push(app.average_rating.toFixed(1))
      if (app.rating_count) bits.push(t("ratingsCount", { n: formatNumber(app.rating_count) }))
      if (app.country) bits.push(countryName(app.country))
      rating.textContent = bits.join(" · ")
      body.append(rating)
      if (Array.isArray(app.genres) && app.genres.length) {
        const tags = document.createElement("div")
        tags.className = "tags"
        for (const genre of app.genres) {
          const tag = document.createElement("span")
          tag.className = "tag"
          tag.textContent = genre
          tags.append(tag)
        }
        body.append(tags)
      }
      const factBits = []
      if (app.price_amount === 0) factBits.push(`${t("priceLabel")} ${t("free")}`)
      else if (app.price) factBits.push(`${t("priceLabel")} ${app.price}`)
      if (app.released) factBits.push(`${t("releasedLabel")} ${ago(app.released)}`)
      if (app.updated) factBits.push(`${t("updatedLabel")} ${ago(app.updated)}`)
      if (factBits.length) {
        const facts = document.createElement("p")
        facts.className = "facts"
        facts.textContent = factBits.join(" · ")
        body.append(facts)
      }
      profile.append(body)
      return profile
    }

    function statGrid(storefronts) {
      const grid = document.createElement("div")
      grid.className = "stat-grid"
      grid.append(ratingShare(storefronts), recentMood())
      return grid
    }

    function ratingShare(storefronts) {
      const card = document.createElement("section")
      card.className = "stat"
      const heading = document.createElement("h3")
      heading.textContent = t("whereRatings")
      card.append(heading)
      const total = storefronts.reduce((sum, item) => sum + (item.rating_count || 0), 0) || 1
      for (const item of storefronts.slice(0, 4)) {
        const row = document.createElement("div")
        row.className = "bar-row"
        const name = document.createElement("span")
        name.textContent = countryName(item.country)
        const track = document.createElement("div")
        track.className = "bar"
        const fill = document.createElement("span")
        const pct = Math.round((item.rating_count / total) * 100)
        fill.style.width = `${pct}%`
        track.append(fill)
        const value = document.createElement("span")
        value.textContent = `${pct}%`
        row.append(name, track, value)
        card.append(row)
      }
      return card
    }

    function recentMood() {
      const card = document.createElement("section")
      card.className = "stat"
      const heading = document.createElement("h3")
      heading.textContent = t("recentReviews")
      const copy = document.createElement("p")
      const cutoff = Date.now() - 30 * 86400000
      const recent = (current.reviews || []).filter((review) => {
        const time = Date.parse(review.updated || "")
        return !Number.isNaN(time) && time >= cutoff
      })
      if (recent.length < 8) {
        copy.textContent = t("notEnoughRecent")
      } else {
        const average = recent.reduce((sum, review) => sum + review.rating, 0) / recent.length
        copy.textContent = t("sentiment", { avg: average.toFixed(1), n: formatNumber(recent.length) })
      }
      card.append(heading, copy)
      return card
    }

    function descriptionBlock(text) {
      const wrap = document.createElement("div")
      const body = document.createElement("p")
      body.className = "description clamped"
      body.textContent = text
      const toggle = document.createElement("button")
      toggle.type = "button"
      toggle.className = "text-button"
      toggle.textContent = t("fullDescription")
      toggle.addEventListener("click", () => {
        const open = body.classList.toggle("clamped")
        toggle.textContent = open ? t("fullDescription") : t("lessDescription")
      })
      wrap.append(body, toggle)
      requestAnimationFrame(() => {
        if (body.scrollHeight <= body.clientHeight + 2) toggle.hidden = true
      })
      return wrap
    }

    function shotBlock(urls) {
      const wrap = document.createElement("div")
      const label = document.createElement("p")
      label.className = "shot-label"
      label.textContent = t("screenshots")
      const row = document.createElement("div")
      row.className = "shots"
      for (const url of urls) {
        const image = document.createElement("img")
        image.src = url
        image.alt = ""
        row.append(image)
      }
      wrap.append(label, row)
      return wrap
    }

    function listBlock() {
      const list = document.createElement("div")
      list.id = "list"
      return list
    }

    function filteredReviews() {
      const needle = query.trim().toLowerCase()
      return (current.reviews || []).filter((review) => {
        if (country !== "all" && review.country !== country) return false
        if (rating !== "all" && String(review.rating) !== rating) return false
        if (!needle) return true
        const haystack = [
          review.title, review.content, review.author,
          translated(review.title), translated(review.content)
        ].join("\n")
        return haystack.toLowerCase().includes(needle)
      })
    }

    async function renderList() {
      const token = ++renderToken
      if (!targetLang) setStatus("")
      const reviews = filteredReviews()
      const list = document.querySelector("#list")
      const slice = reviews.slice(0, shown)
      if (targetLang && slice.length) {
        setStatus(t("statusTranslate", { language: languageName(targetLang) }))
        try {
          await ensureTranslations(slice)
        } catch (error) {
          if (token !== renderToken) return
          setStatus("")
          setError(error instanceof Error ? error.message : t("errorTranslate"))
        }
      }
      if (token !== renderToken || !list) return
      if (targetLang) setStatus("")
      list.replaceChildren()
      if (!slice.length) {
        const empty = document.createElement("p")
        empty.className = "empty"
        empty.textContent = current.reviews.length ? t("noMatch") : t("noReviews")
        list.append(empty)
      }
      for (const review of slice) list.append(reviewCard(review))

      const existing = document.querySelector("#more")
      if (existing) existing.remove()
      if (reviews.length > shown) {
        const more = document.createElement("button")
        more.id = "more"
        more.type = "button"
        more.textContent = t("more", { shown, total: reviews.length })
        more.addEventListener("click", () => {
          shown += PAGE_SIZE
          renderList()
        })
        resultsNode.append(more)
      }
    }

    function filterBar(storefronts) {
      const bar = document.createElement("div")
      bar.className = "filters"

      const countrySelect = document.createElement("select")
      countrySelect.setAttribute("aria-label", t("countryAria"))
      countrySelect.append(option("all", t("countryAll")))
      for (const item of storefronts) {
        const average = typeof item.average_rating === "number" ? ` · ${t("average", { n: item.average_rating.toFixed(1) })}` : ""
        countrySelect.append(option(item.country, `${countryName(item.country)} ${t("reviewCount", { n: item.review_count })}${average}`))
      }
      countrySelect.value = country
      countrySelect.addEventListener("change", () => {
        country = countrySelect.value
        shown = PAGE_SIZE
        renderList()
      })

      const ratingSelect = document.createElement("select")
      ratingSelect.setAttribute("aria-label", t("ratingAria"))
      ratingSelect.append(option("all", t("ratingAll")))
      for (const value of [5, 4, 3, 2, 1]) {
        const label = uiLang === "en" && value === 1 ? "1 star" : t("ratingN", { n: value })
        ratingSelect.append(option(String(value), label))
      }
      ratingSelect.value = rating
      ratingSelect.addEventListener("change", () => {
        rating = ratingSelect.value
        shown = PAGE_SIZE
        renderList()
      })

      const search = document.createElement("input")
      search.type = "text"
      search.placeholder = t("searchPlaceholder")
      search.setAttribute("aria-label", t("searchAria"))
      search.value = query
      search.addEventListener("input", () => {
        query = search.value
        shown = PAGE_SIZE
        renderList()
      })

      bar.append(countrySelect, ratingSelect, search)
      return bar
    }

    async function ensureTranslations(reviews) {
      const needed = []
      const keys = []
      for (const review of reviews) {
        for (const field of ["title", "content"]) {
          const text = review[field] || ""
          const key = `${targetLang}\0${text}`
          if (text && !translationCache.has(key) && !keys.includes(key)) {
            needed.push(text)
            keys.push(key)
          }
        }
      }
      if (!needed.length) return
      const response = await fetch("/api/translate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ target: targetLang, texts: needed })
      })
      const body = await response.json().catch(() => ({}))
      if (!response.ok) throw new Error(errorText(body.code || "errorTranslate"))
      const translations = body.translations || []
      if (translations.length !== needed.length) throw new Error(t("errorIncomplete"))
      translations.forEach((value, index) => translationCache.set(keys[index], value))
    }

    function translated(text) {
      if (!targetLang || !text) return text || ""
      return translationCache.get(`${targetLang}\0${text}`) ?? text
    }

    function option(value, label) {
      const node = document.createElement("option")
      node.value = value
      node.textContent = label
      return node
    }

    function reviewCard(review) {
      const article = document.createElement("article")
      article.className = "review"
      const header = document.createElement("header")
      const stars = document.createElement("span")
      stars.className = "stars"
      const score = Number(review.rating) || 0
      stars.textContent = "★".repeat(score) + "☆".repeat(Math.max(0, 5 - score))
      stars.setAttribute("aria-label", t("starsAria", { n: score }))
      const who = document.createElement("span")
      who.className = "who"
      const bits = [countryName(review.country), formatDate(review.updated)]
      if (review.version) bits.push(`v${review.version}`)
      if (review.author) bits.push(review.author)
      if (review.vote_count) bits.push(t("helpful", { n: review.vote_count }))
      who.textContent = bits.filter(Boolean).join(" · ")
      header.append(stars, who)
      const titleText = translated(review.title)
      const bodyText = translated(review.content)
      const heading = document.createElement("h3")
      heading.textContent = titleText || t("untitled")
      const body = document.createElement("p")
      body.textContent = bodyText
      article.append(header, heading, body)
      const originalTitle = review.title || ""
      const originalBody = review.content || ""
      if (targetLang && (titleText !== originalTitle || bodyText !== originalBody)) {
        const original = document.createElement("p")
        original.className = "original"
        const label = document.createElement("span")
        label.className = "original-label"
        label.textContent = t("original")
        original.append(label, document.createTextNode([originalTitle, originalBody].filter(Boolean).join("\n")))
        article.append(original)
      }
      return article
    }

    function formatDate(value) {
      if (!value) return ""
      const date = new Date(value)
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 10)
      return new Intl.DateTimeFormat(dateLocale(), { year: "numeric", month: "short", day: "numeric" }).format(date)
    }
  </script>
</body>
